[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
check_untyped_defs = False
pretty = True
files = rag, api, scripts/run_rag_eval.py

# Incremental tightening: start with retrieval/eval core.
[mypy-rag.retrieval]
disallow_untyped_defs = True

[mypy-rag.rrf]
disallow_untyped_defs = True
