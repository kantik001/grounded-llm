target-version = "py311"
line-length = 120
src = ["rag", "api", "tests", "scripts", "sdk/python"]

[lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[lint.per-file-ignores]
"api/app.py" = ["E402"]
"api/retriever_pb2.py" = ["E", "F", "I", "W"]
"api/retriever_pb2_grpc.py" = ["E", "F", "I", "W"]

[format]
quote-style = "double"
