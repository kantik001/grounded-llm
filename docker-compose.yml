name: grounded_llm

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: grounded_llm_postgres
    environment:
      POSTGRES_USER: grounded
      POSTGRES_PASSWORD: grounded
      POSTGRES_DB: grounded
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grounded -d grounded"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: grounded_llm_redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # CPU-friendly local LLM (Windows / no GPU). Usage:
  #   docker compose --profile ollama up -d
  #   docker compose exec ollama ollama pull llama3.2
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: grounded_llm_ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # GPU local inference (OpenAI-compatible). Usage:
  #   docker compose --profile vllm up -d
  # Requires NVIDIA Container Toolkit + enough VRAM for the model.
  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:latest
    container_name: grounded_llm_vllm
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    command:
      - "--model"
      - "${VLLM_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-4096}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.90}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: grounded_llm_python
    # Local debug only — bind to loopback (not LAN). Production: use docker-compose.prod.yml (no host port).
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:50051:50051"
    restart: unless-stopped
    environment:
      - PYTHON_SERVICE_PORT=5000
      - PYTHON_GRPC_PORT=50051
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - EMBEDDING_CACHE_TTL_SEC=${EMBEDDING_CACHE_TTL_SEC:-3600}
      - DOMAINS_CONFIG_PATH=/config/domains.json
      - FORCE_RAG_REINDEX=${FORCE_RAG_REINDEX:-false}
      - VECTOR_STORE=${VECTOR_STORE:-chroma}
      - DATABASE_URL=${DATABASE_URL:-postgres://grounded:grounded@postgres:5432/grounded?sslmode=disable}
      - PGVECTOR_URL=${PGVECTOR_URL:-}
      - PGVECTOR_COLLECTION=${PGVECTOR_COLLECTION:-grounded_chunks}
      - ADMIN_SECRET=${ADMIN_SECRET:-}
      - RAG_SERVICE_TOKEN=${RAG_SERVICE_TOKEN:-}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-en}
      - GROUNDED_ENV=${GROUNDED_ENV:-development}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      - RAG_RETRIEVAL_MODE=${RAG_RETRIEVAL_MODE:-hybrid}
      - RAG_RERANKER=${RAG_RERANKER:-keyword}
      - RAG_CROSS_ENCODER_MODEL=${RAG_CROSS_ENCODER_MODEL:-}
      - INGEST_ASYNC=${INGEST_ASYNC:-1}
      - INGEST_STAGING_DIR=${INGEST_STAGING_DIR:-/app/ingest_staging}
    volumes:
      - chroma_data:/app/chroma_db
      - ./api:/app/api:ro
      - ./rag:/app/rag:ro
      - ./data:/app/data:ro
      - ./config:/config:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  ingest-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "-m", "workers.ingest_worker"]
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgres://grounded:grounded@postgres:5432/grounded?sslmode=disable}
      - DATA_DIR=/app/data
      - INGEST_ASYNC=1
      - INGEST_USE_REDIS=1
      - INGEST_WORKER_STAGE=all
      - INGEST_STAGING_DIR=/app/ingest_staging
      - VECTOR_STORE=${VECTOR_STORE:-chroma}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - DOMAINS_CONFIG_PATH=/config/domains.json
    volumes:
      - chroma_data:/app/chroma_db
      - ingest_staging:/app/ingest_staging
      - ./rag:/app/rag:ro
      - ./workers:/app/workers:ro
      - ./data:/app/data:ro
      - ./config:/config:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      python:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: grounded_llm_server
    ports:
      - "8080:8080"
    environment:
      - PYTHON_RAG_URL=http://python:5000/rag/context
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LLM_RESPONSE_CACHE_TTL_SEC=${LLM_RESPONSE_CACHE_TTL_SEC:-86400}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-openrouter/free}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - VLLM_MODEL=${VLLM_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      - SERVER_PORT=8080
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_AUTH_DISABLED=${TELEGRAM_AUTH_DISABLED:-false}
      - TELEGRAM_INIT_DATA_MAX_AGE_SEC=${TELEGRAM_INIT_DATA_MAX_AGE_SEC:-86400}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-30}
      - DATABASE_URL=postgres://grounded:grounded@postgres:5432/grounded?sslmode=disable
      - UPLOAD_DIR=/data/uploads
      - MIGRATIONS_DIR=/migrations
      - DOMAINS_CONFIG_PATH=/config/domains.json
      - LOCALES_ROOT=/config/locales
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-en}
      - CONFIG_RELOAD_INTERVAL_SEC=${CONFIG_RELOAD_INTERVAL_SEC:-0}
      - DATA_DIR=/app/data
      - PYTHON_BASE_URL=http://python:5000
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_SECRET=${ADMIN_SECRET:-}
      - RAG_SERVICE_TOKEN=${RAG_SERVICE_TOKEN:-}
      - MESSAGE_RETENTION_DAYS=${MESSAGE_RETENTION_DAYS:-0}
      - SESSION_RETENTION_DAYS=${SESSION_RETENTION_DAYS:-0}
      - RETENTION_INTERVAL_HOURS=${RETENTION_INTERVAL_HOURS:-24}
      - LLM_MOCK=${LLM_MOCK:-}
      - RAG_MOCK=${RAG_MOCK:-}
      - GROUNDED_ENV=${GROUNDED_ENV:-development}
    volumes:
      - uploads_data:/data/uploads
      - ./data:/app/data
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: grounded_llm_webapp
    ports:
      - "80:80"
    volumes:
      - ./webapp/index.html:/usr/share/nginx/html/index.html:ro
      - ./webapp/app.css:/usr/share/nginx/html/app.css:ro
      - ./webapp/app.js:/usr/share/nginx/html/app.js:ro
      - ./webapp/admin.html:/usr/share/nginx/html/admin.html:ro
      - ./webapp/admin.js:/usr/share/nginx/html/admin.js:ro
      - ./webapp/embed.html:/usr/share/nginx/html/embed.html:ro
      - ./webapp/embed.css:/usr/share/nginx/html/embed.css:ro
      - ./webapp/embed.js:/usr/share/nginx/html/embed.js:ro
      - ./webapp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  chroma_data:
  ingest_staging:
  postgres_data:
  uploads_data:
  ollama_data:
