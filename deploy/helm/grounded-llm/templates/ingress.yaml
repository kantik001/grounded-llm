{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "grounded-llm.fullname" . }}
  labels:
    {{- include "grounded-llm.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" (include "grounded-llm.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "grounded-llm.fullname" . }}-webapp
                port:
                  number: {{ .Values.webapp.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "grounded-llm.fullname" . }}-server
                port:
                  number: {{ .Values.server.port }}
{{- end }}
