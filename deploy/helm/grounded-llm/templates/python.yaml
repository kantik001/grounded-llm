apiVersion: v1
kind: Service
metadata:
  name: {{ include "grounded-llm.fullname" . }}-python
  labels:
    {{- include "grounded-llm.labels" . | nindent 4 }}
    app.kubernetes.io/component: python
spec:
  ports:
    - port: {{ .Values.python.port }}
      targetPort: http
      name: http
    - port: {{ .Values.python.grpcPort }}
      targetPort: grpc
      name: grpc
  selector:
    {{- include "grounded-llm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: python
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grounded-llm.fullname" . }}-python
  labels:
    {{- include "grounded-llm.labels" . | nindent 4 }}
    app.kubernetes.io/component: python
spec:
  replicas: {{ .Values.python.replicaCount }}
  selector:
    matchLabels:
      {{- include "grounded-llm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: python
  template:
    metadata:
      labels:
        {{- include "grounded-llm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: python
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: python
          image: "{{ .Values.python.image.repository }}:{{ .Values.python.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.python.port }}
              name: http
            - containerPort: {{ .Values.python.grpcPort }}
              name: grpc
          env:
            - name: PYTHON_SERVICE_PORT
              value: {{ .Values.python.port | quote }}
            - name: PYTHON_GRPC_PORT
              value: {{ .Values.python.grpcPort | quote }}
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "grounded-llm.fullname" . }}-secrets
                  key: ADMIN_SECRET
            - name: RAG_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "grounded-llm.fullname" . }}-secrets
                  key: RAG_SERVICE_TOKEN
            {{- range $k, $v := .Values.python.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: chroma
              mountPath: /app/chroma_db
          startupProbe:
            httpGet:
              path: {{ .Values.python.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.python.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.python.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.python.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.python.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.python.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.python.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.python.probes.liveness.failureThreshold }}
          readinessProbe:
            # exec keeps RAG_SERVICE_TOKEN out of the pod spec (it is injected
            # via secretKeyRef and read from the environment at probe time).
            exec:
              command:
                - python
                - -c
                - |
                  import os, urllib.request
                  req = urllib.request.Request(
                      "http://127.0.0.1:{{ .Values.python.port }}{{ .Values.python.probes.readiness.path }}",
                      headers={"X-RAG-Service-Token": os.environ.get("RAG_SERVICE_TOKEN", "")},
                  )
                  urllib.request.urlopen(req, timeout={{ .Values.python.probes.readiness.timeoutSeconds }}).read()
            initialDelaySeconds: {{ .Values.python.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.python.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.python.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.python.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.python.resources | nindent 12 }}
      volumes:
        - name: chroma
          persistentVolumeClaim:
            claimName: {{ include "grounded-llm.fullname" . }}-chroma
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "grounded-llm.fullname" . }}-chroma
  labels:
    {{- include "grounded-llm.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.python.persistence.chromaSize }}
