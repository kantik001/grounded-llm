name: CI

# Single workflow name "CI" keeps branch-protection required check names stable.
# Shared setup: .github/actions/* and top-level env below. Map: .github/AUTOMATION.md

on:
  push:
    branches:
      - master
      - main
      - "feature/**"
      - "refactor/**"
      - "chore/**"
      - "fix/**"
      - "docs/**"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  PYTHON_VERSION: "3.11"
  DEFAULT_LOCALE: en
  DOMAINS_CONFIG_PATH: ${{ github.workspace }}/config/domains.json
  LOCALES_ROOT: ${{ github.workspace }}/config/locales
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface

jobs:
  go-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-ci
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: server

  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-ci
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go mod tidy
        run: go mod tidy
      - name: Go test with coverage
        env:
          LLM_MOCK: "true"
          RAG_MOCK: "true"
        run: go test -v -count=1 -coverprofile=coverage.out ./...
      - name: Go coverage summary
        run: go tool cover -func=coverage.out | tail -1

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-ci
      - name: Ruff check
        run: pip install ruff==0.8.4 && ruff check rag api tests scripts sdk/python conformance connectors
      - name: gRPC stubs in sync with proto
        run: |
          pip install 'grpcio==1.69.0' 'grpcio-tools==1.69.0' 'protobuf>=4.25.0,<6'
          python scripts/gen_retriever_grpc.py --check

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.1"
      - name: buf lint
        run: buf lint
      - name: buf breaking (vs main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"

  conformance-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-ci
      - name: OpenAPI conformance (offline)
        run: |
          pip install -r conformance/requirements.txt
          python -m conformance spec

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-ci
        with:
          cache: "true"
          cache-dependency-path: |
            tests/requirements-test.txt
            api/requirements.txt
            conformance/requirements.txt
      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt
      - name: Pytest with coverage
        env:
          DOMAINS_CONFIG_PATH: config/domains.json
        run: pytest tests/ -v --tb=short --cov=rag --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=70

  # Alias job: branch protection may still require this check name.
  # Real validation lives in conformance-spec (same openapi-spec-validator pin).
  openapi-validate:
    needs: conformance-spec
    runs-on: ubuntu-latest
    steps:
      - name: Covered by conformance-spec
        run: echo "OpenAPI validation is CI / conformance-spec (conformance/requirements.txt)"

  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-ci
      - name: Install SDK with dev deps
        run: pip install -e "sdk/python[dev]"
      - name: SDK unit tests
        run: pytest sdk/python/tests -v --tb=short
      - name: Ruff SDK
        run: pip install ruff==0.8.4 && ruff check sdk/python

  eval-baseline-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-ci
      - name: Validate eval JSONL baselines
        run: pip install pytest && pytest tests/test_eval_baseline.py -v

  eval-retrieval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://grounded:grounded@localhost:5432/grounded?sslmode=disable
      KB_BLOB_DIR: /tmp/grounded-kb-blobs
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: grounded
          POSTGRES_PASSWORD: grounded
          POSTGRES_DB: grounded
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grounded -d grounded"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-ci
        with:
          cache: "true"
          cache-dependency-path: api/requirements.txt
      - uses: ./.github/actions/cache-hf-e5
      - name: Install RAG dependencies
        run: pip install -r api/requirements.txt requests
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prefetch embedding model
        run: |
          python -c "from langchain_huggingface import HuggingFaceEmbeddings; HuggingFaceEmbeddings(model_name='intfloat/multilingual-e5-small')"
      - name: Seed KB registry from data/
        env:
          DATABASE_URL: postgres://grounded:grounded@localhost:5432/grounded?sslmode=disable
          DATA_DIR: ${{ github.workspace }}/data
          KB_BLOB_DIR: /tmp/grounded-kb-blobs
        run: bash scripts/ci_prepare_kb_registry.sh
      - name: Reindex Chroma
        env:
          DATABASE_URL: postgres://grounded:grounded@localhost:5432/grounded?sslmode=disable
          KB_BLOB_DIR: /tmp/grounded-kb-blobs
          FORCE_RAG_REINDEX: "true"
          RAG_RETRIEVAL_MODE: hybrid
        run: python scripts/reindex_rag.py
      - name: Retrieval eval gate (RAG HTTP + all suites, hybrid default)
        env:
          PYTHON_SERVICE_PORT: "5000"
          RAG_RETRIEVAL_MODE: hybrid
          RAG_RERANKER: keyword
          DATABASE_URL: postgres://grounded:grounded@localhost:5432/grounded?sslmode=disable
          KB_BLOB_DIR: /tmp/grounded-kb-blobs
        run: bash scripts/ci_eval_retrieval.sh --skip-reindex

  smoke-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: grounded
          POSTGRES_PASSWORD: grounded
          POSTGRES_DB: grounded
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grounded -d grounded"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-ci
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build and start server
        env:
          DATABASE_URL: postgres://grounded:grounded@localhost:5432/grounded?sslmode=disable
        run: bash scripts/ci_start_mock_server.sh
      - name: Smoke test (health + full /message path)
        run: bash scripts/smoke.sh http://127.0.0.1:8080
      - name: Adversarial E2E (mock LLM + RAG)
        run: pip install requests && python scripts/run_adversarial_e2e.py --base-url http://127.0.0.1:8080
      - name: OpenAPI HTTP conformance
        run: |
          pip install -r conformance/requirements.txt
          python -m conformance http --url http://127.0.0.1:8080
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) 2>/dev/null || true; fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build server image
        run: docker build -f Dockerfile.server -t grounded-llm-server:ci .
      - name: Build webapp image
        run: docker build -f Dockerfile.webapp -t grounded-llm-webapp:ci .
      - name: Build python image
        run: docker build -f Dockerfile.python -t grounded-llm-python:ci .
      # Pin by commit SHA (v0.36.0); avoid mutable/missing numeric tags after trivy-action remediations.
      - name: Trivy scan server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: grounded-llm-server:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy scan webapp image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: grounded-llm-webapp:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      # Python image pulls torch/CUDA wheels — many unfixed HIGH; gate on CRITICAL only.
      - name: Trivy scan python image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: grounded-llm-python:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: Helm lint
        run: helm lint deploy/helm/grounded-llm
      - name: Helm template (smoke render)
        run: |
          helm template grounded deploy/helm/grounded-llm \
            --set secrets.ragServiceToken=ci-token \
            --set secrets.adminPassword=ci-pass \
            --set secrets.adminSecret=ci-secret \
            --set secrets.llmApiKey=ci-key \
            >/dev/null

  backup-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: grounded
          POSTGRES_PASSWORD: grounded
          POSTGRES_DB: grounded
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grounded -d grounded"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Postgres backup/restore smoke
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: grounded
          PGPASSWORD: grounded
          PGDATABASE: grounded
          PGSSLMODE: disable
        run: bash scripts/backup_postgres_smoke.sh

  load-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: grounded
          POSTGRES_PASSWORD: grounded
          POSTGRES_DB: grounded
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grounded -d grounded"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-ci
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build and start server (mock LLM/RAG)
        env:
          DATABASE_URL: postgres://grounded:grounded@localhost:5432/grounded?sslmode=disable
          # Default is 30 req/min; concurrent load smoke exceeds that and returns 429.
          RATE_LIMIT_REQUESTS_PER_MINUTE: "2000"
        run: bash scripts/ci_start_mock_server.sh
      - name: Concurrent load smoke
        run: bash scripts/load_smoke.sh http://127.0.0.1:8080 20 2
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) 2>/dev/null || true; fi
