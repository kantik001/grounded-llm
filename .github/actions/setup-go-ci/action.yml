name: Setup Go (CI)
description: Go toolchain for server/ with module cache
inputs:
  go-version:
    description: Go version
    required: false
    default: "1.25"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: server/go.sum
