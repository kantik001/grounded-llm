# Dependabot — weekly grouped updates (see CONTRIBUTING.md / SECURITY.md)
version: 2
updates:
  # Go server
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns:
          - "*"

  # Python RAG service (+ requirements-*.txt extras in the same directory)
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      langchain:
        patterns:
          - "langchain*"
      api-misc:
        patterns:
          - "*"
        exclude-patterns:
          - "langchain*"
    ignore:
      # Majors need a coordinated RAG-stack bump, not weekly spam.
      - dependency-name: "langchain*"
        update-types: ["version-update:semver-major"]
      # Keep protobuf<6 for current grpcio stack (see api/requirements.txt).
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "grpcio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "grpcio-health-checking"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sentence-transformers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chromadb"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pypdf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gunicorn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "flask"
        update-types: ["version-update:semver-major"]
      - dependency-name: "flask-cors"
        update-types: ["version-update:semver-major"]

  # Pytest / test deps (often pins overlap with api — same major policy)
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      tests-pip:
        patterns:
          - "*"
    ignore:
      - dependency-name: "langchain*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sentence-transformers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chromadb"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pypdf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gunicorn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]

  # Spec / OpenAPI conformance CLI
  - package-ecosystem: pip
    directory: /conformance
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      conformance-pip:
        patterns:
          - "*"
    ignore:
      - dependency-name: "openapi-spec-validator"
        update-types: ["version-update:semver-major"]

  # Optional ingest connectors (Google Drive API extras)
  - package-ecosystem: pip
    directory: /connectors
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      connectors-pip:
        patterns:
          - "*"

  # Python SDK + CLI (pyproject.toml)
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      sdk-pip:
        patterns:
          - "*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
